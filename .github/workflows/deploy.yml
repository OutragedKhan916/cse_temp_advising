name: Build and deploy
on:
  push:
    branches: [main, "feature/**"]   # builds main and any feature/* branch (e.g. feature/planner)
  pull_request:
    branches: [main]
  workflow_dispatch:                 # Actions tab -> Run workflow: deploys the chosen branch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build
        env:
          NEXT_PUBLIC_CF_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then export BASE_PATH=""; else export BASE_PATH="/$REPO"; fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    # live site = main (automatic) or a branch you start by hand with "Run workflow"
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
